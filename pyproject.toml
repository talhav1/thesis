[project]
name = "thesis-reliability"
version = "0.1.0"
description = "Calibrated quantile inference in sequential sensitivity experiments (Phases 0-2)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "pyarrow>=12"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
